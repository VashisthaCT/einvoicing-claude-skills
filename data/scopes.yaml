  # =====================================================================================
  # EU / MY / MEA blocks below are AUTO-DISCOVERED (Slack/PagerDuty/CubeAPM sweep,
  # 2026-06-15). Each value is flagged with a confidence marker in `notes`. The incoming
  # on-call for that region MUST verify channel IDs, PD prefixes, and generate endpoints
  # against a live week before trusting the metrics tables.
  # =====================================================================================

  eu:
    label: EU / Peppol
    # Auto-discovered 2026-06-15 — HIGH confidence (verified against ~90d PD incidents + live 7d CubeAPM traffic).
    output: { repo_path: ~/Desktop/einvoicing-core, subdir: "docs/oncall-handover/eu" }   # → ~/Desktop/einvoicing-core/docs/oncall-handover/eu/oncall-handover-<weekstart>.md
    pd_service_prefixes:
      - "[E-Invoicing-EU]"        # single PD service POAA504 "Alerts Sev2" carries BOTH urgencies (no separate Sev1 service)
    alert_channels:
      - { name: "#einvoicing-global-pds-sev2", id: C0A6G866FH7 }   # misleadingly "global"-named but in practice carries ONLY [E-Invoicing-EU] PD-bot posts today; the pd_service_prefixes filter is what scopes it
    l3_channels:
      - { name: "#einvoice-eu-l3-support", id: C0A6XNJG1A4 }       # dedicated EU L3 (Jira project EOCJ); does NOT use the IND/GCC #einvoice-l3-support
    l3_workflow_bot: { name: "EInvoicing Europe Customer Issues to L3", id: B0A91P9QDEV }   # EU escalation workflow (Jira EOCJ); discovered 2026-06-15, verify on first run
    cubeapm_services:
      - einvoicing-core-prod-eu-http
      - clear-peppol-ap-outbound-prod-eu-http
      - clear-peppol-ap-inbound-prod-eu-http
    generate_endpoints:
      - { service: einvoicing-core-prod-eu-http, span_name: "v1/einvoice/generate (POST)" }            # ~15k/7d — canonical EU document generate (einvoicing-core SaaS, serves BE/FR/PL/DE)
      - { service: clear-peppol-ap-outbound-prod-eu-http, span_name: "clear-ap/v1/transactions (POST)" } # ~825/7d — AS4 outbound transmit to Peppol network (EU "submit/clearance" leg)
    topk_service_regex: "einvoicing-core-prod-eu-http|clear-peppol-ap-outbound-prod-eu-http|clear-peppol-ap-inbound-prod-eu-http"
    noisy_rule_ids:
      - "1158"   # Einvoicin-Integrations EU Anomaly (call-rate dip)
      - "1159"   # Einvoicin-Routing EU Anomaly
      - "1160"   # Einvoicin-Peppol EU Anomaly
    customers: []   # EU L3 tickets are COUNTRY-keyed (Belgium / France / Poland / Croatia), not customer-name-keyed — add customer tokens here as you see them
    notes: >
      HIGH confidence. PD: one service "[E-Invoicing-EU] Alerts Sev2" (POAA504, ct-zurg) carries both
      High (Sev1-equiv) and Low (Sev2) — no separate Sev1 service. Two-stage flow: einvoicing-core
      GENERATEs the UBL/PINT doc → clear-peppol-ap OUTBOUND transmits via AS4 (no IRN concept in Peppol).
      The clear-peppol-ap-INBOUND service is AS4-receive only (no generate span) — kept in topk for breadth,
      excluded from generate_endpoints. Secondary EU error feed (Coralogix, NOT the PD bot): #einvoicing-eu-prod-alerts
      (C0A9NPQ8Z9R) — useful signal but not the alert_channel. Caveat: the "global"-named PD channel could in
      future carry other regions — rely on the [E-Invoicing-EU] prefix filter, not the channel name.

  my:
    label: Malaysia (MY)
    # Auto-discovered 2026-06-15 — HIGH confidence (verified against ~90d PD incidents + live 7d CubeAPM traffic).
    output: { repo_path: ~/Desktop/einvoicing-core, subdir: "docs/oncall-handover/my" }   # → ~/Desktop/einvoicing-core/docs/oncall-handover/my/oncall-handover-<weekstart>.md
