    label: MEA (UAE / Oman / Jordan)
    # Auto-discovered 2026-06-15 — MEDIUM overall (services HIGH/verified; PD routing LOW — see notes). MEA e-invoicing is early:
    # UAE PINT-AE + Oman Fawtara (go-live ~Aug 2026, discovery stage) + Jordan JoFotara. No dedicated PD service exists YET.
