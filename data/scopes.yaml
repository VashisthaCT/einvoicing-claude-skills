    l3_workflow_bot: { name: "Escalate Customer Issues to L3 New 2", id: B094B94DUSZ }   # shared IND+GCC escalation workflow; attribute region via the post's "Product: Einvoice India/GCC" field + JIRA project (EIOCJ=IND, GOCJ=GCC)
    cubeapm_services:
      - einvoicingbe-prod-oci-http
      - einvoicingbe-prod-oci-bulk-http
    generate_endpoints:
