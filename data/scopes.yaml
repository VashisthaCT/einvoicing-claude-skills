      - { name: "#einvoicing-mea-pds", id: C0B66JQHD4H }    # dedicated MEA alert channel (created 2026-05-26 by Ayush, core team joined). Empty as of 2026-06-15 → MEA PD section reads "None this week" until a MEA PD service fires here. Add more channels to this list as they are created.
    # OPTIONAL fallback (left OFF per user preference 2026-06-15). Before the dedicated MEA service/channel is live,
    # MEA workloads page under the generic shared "DevOps Alerts Sev 2" (PV4Q1O5) in #devops-alerts-sev2 (C08SAGJQXCG).
    # To capture those in the meantime: add `- { name: "#devops-alerts-sev2", id: C08SAGJQXCG }` to alert_channels
    # above AND uncomment the next line — Step 2 then keeps DevOps-Alerts posts whose body matches this MEA-workload regex:
    # pd_workload_filter: "(einvoicing-core|einvoicing-integrations|einvoicing-routing|clear-peppol-ap-(inbound|outbound))-prod-oci-mea-"
    l3_channels:
      - { name: "#einvoice-mea-l3-support", id: C0AB8EAH9A6 }   # HIGH confidence, live (Tabby UAE prod issues); Jira project MEA (board 1588). Does NOT use #einvoice-l3-support.
    l3_workflow_bot: {}   # no dedicated MEA escalation workflow found as of 2026-06-15 → Step 4 falls back to reply_count>=5. Re-check after MEA GA; add the bot here once it exists.
    cubeapm_services:
      - einvoicing-core-prod-oci-mea-http
      - einvoicing-integrations-prod-oci-mea-http
      - einvoicing-routing-prod-oci-mea-http
    generate_endpoints:
      - { service: einvoicing-core-prod-oci-mea-http, span_name: "v1/einvoice/generate (POST)" }        # ~298/7d — PRIMARY MEA generate
      - { service: einvoicing-integrations-prod-oci-mea-http, span_name: "einvoice/v1/documents/send (POST)" } # ~306/7d — Peppol document dispatch/send (4/5-corner submit to AP)
      - { service: einvoicing-core-prod-oci-mea-http, span_name: "bulk/{mode}/** (POST)" }               # ~137/7d — bulk submit
      - { service: einvoicing-core-prod-oci-mea-http, span_name: "v1/participant/generate (POST)" }      # ~2/7d — Peppol participant registry (PINT-AE/OM), low but live
      - { service: einvoicing-core-prod-oci-mea-http, span_name: "v1/taxpayer/submit (POST)" }           # ~1/7d — taxpayer onboarding submit, low but live
    topk_service_regex: "einvoicing-core-prod-oci-mea-http|einvoicing-integrations-prod-oci-mea-http|einvoicing-routing-prod-oci-mea-http"
    noisy_rule_ids: []   # "Einvoicin MEA Anomaly" alerts exist (seen for Tabby UAE prod) but rule_ids weren't captured — fill after first live run
    customers: [Tabby]   # UAE; non-exhaustive. Add tokens as you see them.
    notes: >
      VERIFIED HIGH: CubeAPM services + generate endpoints (live 7d traffic; *-prod-oci-mea-* OCI host pattern
