      once an alert fires into it. (3) #einvoicing-global-pds-sev2 is the EU channel, NOT MEA — do not conflate.
      (4) NO clear-peppol-ap on MEA OCI — the MEA generate flow runs through einvoicing-core + einvoicing-integrations;
      the Peppol AP layer lives in the EU region. Re-run discovery for MEA after Oman/UAE GA (~Aug 2026) — endpoint
      set and PD routing will likely change.
