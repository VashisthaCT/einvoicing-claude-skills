scopes:

  ind:
    label: India
    pd_service_prefixes:
      - "[E-Invoicing-Ind]"
      - "[EInv-Ind"
    alert_channels:
      - { name: "#e-invoicing-pds", id: C0209C9E153 }
    l3_channels:
      - { name: "#einvoice-l3-support", id: C055ABMAVCL }
    l3_workflow_bot: { name: "Escalate Customer Issues to L3 New 2", id: B094B94DUSZ }   # shared IND+GCC escalation workflow; attribute region via the post's "Product: Einvoice India/GCC" field + JIRA project (EIOCJ=IND, GOCJ=GCC)
    cubeapm_services:
      - einvoicingbe-prod-http
      - einvoicing-integrations-prod-http
    generate_endpoints:
