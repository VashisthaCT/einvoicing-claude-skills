      IRP routes to Coralogix only — #irp-prod-alerts has ZERO PD bot posts, so IND real
      PD count from E-Invoicing PD services is typically 0. IRP CrashLoopBackOff incidents
      land on "Business Platform Alerts Sev1" (different team's PD service) — surface those
      as a routing-gap callout in prose, NOT in the table.

