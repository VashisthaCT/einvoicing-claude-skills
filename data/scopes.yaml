      - { service: einvoicingbe-prod-oci-http, span_name: "v2/einvoices/generate-with-file (POST)" }
      - { service: einvoicingbe-prod-oci-http, span_name: "v2/einvoices/generate/async (POST)" }
      - { service: einvoicingbe-prod-oci-http, span_name: "v2/einvoices/generate-with-file-offline (POST)" }
