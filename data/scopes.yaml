      - { service: einvoicing-core-prod-my-http, span_name: "v1/einvoice/b2c/generate (POST)" }                  # ~1k/7d — B2C/self-billed consolidated path
      - { service: einvoicing-core-prod-my-http, span_name: "my/v1/einvoice/consolidate_generate (POST)" }       # ~16/7d — MY consolidated generate (low volume but live)
    topk_service_regex: "einvoicing-core-prod-my-http|einvoicing-integrations-prod-my-http|einvoicing-routing-prod-my-http"
    noisy_rule_ids: []   # MY anomaly alerts ("Einvoicing Core My Anomaly", "Routing MY Anomaly") exist but their CubeAPM rule_ids weren't captured — fill in after the first live run
    customers: [Samling]   # non-exhaustive; product field = "Einvoice Malaysia". Add tokens as you see them.
    notes: >
      HIGH confidence on PD prefix + services + endpoints. ROUTING NUANCE: unlike IND/GCC, MY does not have a
      dedicated PagerDuty-incident-bot channel — its Sev2-class alerts arrive as Coralogix priority alerts
      (P2=ERROR, P1=CRITICAL) on app "ct-my-prod" that post to #einvoicing-malaysia-prod-alerts AND fan out to
      PagerDuty (PD service PGFR06I, prefix [E-Invoicing-Malaysia]). VERIFY on first run that Step 2's PD-bot
      parser actually picks these up — the Slack format is Coralogix-native, so you may need to match on the
      "[CRITICAL]/[FIRING]" + "[E-Invoicing-Malaysia]" / "einvoicing-malaysia" tokens rather than the IND/GCC
      PD-bot layout. No -bulk-http service (KSA-only pattern); bulk flows via Kafka topic big-generate_einv_topic_prod.
      einvoicing-routing-prod-my-http has no generate span (kept in topk regex only).

