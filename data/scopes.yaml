      - { service: einvoicingbe-prod-http, span_name: "v1/ewaybill/generate (POST)" }
      - { service: einvoicing-integrations-prod-http, span_name: "v2/eInvoice/generate (PUT)" }
      - { service: einvoicing-integrations-prod-http, span_name: "v2/eInvoice/ewaybill (POST)" }
