# scopes.yaml — region/rotation config for the v-oncall-handover skill.
#
# The skill engine (skills/v-oncall-handover/SKILL.md) is GENERIC. Everything
# region-specific lives here. To add a region (or fix one), edit only this file.
#
# `--scope <keys>` selects which top-level `scopes:` blocks to run, e.g.
#   /v-oncall-handover --scope ind,ksa   (default — one combined doc)
#   /v-oncall-handover --scope eu
#   /v-oncall-handover --scope my
#   /v-oncall-handover --scope mea
# Multiple scopes -> one combined doc with one section per scope (in the order
# given). Single scope -> single-region doc.
#
# Field reference (per scope):
#   label                 Human name used in section headings + the summary line.
#   pd_service_prefixes   Bracketed PagerDuty service prefixes to KEEP. A PD bot
#                         post is in-scope only if its PD Service starts with one
#                         of these. (Step 2 filter.)
#   pd_workload_filter    (optional) Regex over the alert body/workload name. Use
#                         ONLY for a region that has no dedicated PD service yet and
#                         whose alerts land on the shared "DevOps Alerts Sev 2"
#                         service — Step 2 then KEEPS such generic-service posts iff
#                         the body matches this regex. Omit once the region gets its
#                         own pd_service_prefix. (MEA today; see its block.)
#   alert_channels        Slack channels where this region's Sev2 PD bot posts land
#                         (analog of IND #e-invoicing-pds). {name, id}.
#   l3_channels           Slack channels carrying this region's customer-facing L3
#                         threads (Step 4). {name, id}. May be shared.
#   l3_workflow_bot       The Slack workflow/bot that posts STRUCTURED L3 escalations
#                         into l3_channels — the canonical CFD source for Step 4.
#                         {name, id}. A CFD = ONE such bot post (carries a Salesforce
#                         ticket + JIRA link + Product/Workspace fields); ad-hoc human
#                         threads are NOT CFDs. Empty = no escalation workflow yet →
#                         fall back to the reply_count>=5 heuristic + note it.
#   cubeapm_services      Prod HTTP service names for this region (CubeAPM `service`
#                         label). Used by the per-region Top-3 tables.
#   generate_endpoints    The "critical" generate paths for the Critical-API Health
#                         table (Step 5a). {service, span_name}. span_name format:
#                         "WebTransaction/SpringController/<path> (<METHOD>)" — but
#                         here store just the human "<path> (<METHOD>)" tail.
#   topk_service_regex    Pipe-joined service regex for the Top-3 slowest/error-prone
#                         queries (Step 5b).
#   noisy_rule_ids        CubeAPM rule_ids that habitually fire false anomaly alerts
#                         for this region (Step 3 false-alert hints).
#   customers             Known customer-name tokens for L3 CFD attribution (Step 4).
#                         Non-exhaustive hint list; extend as you see new ones.
#   notes                 Free-text gotchas surfaced per region (routing gaps etc).
#   output                (optional) Per-scope output-location override {repo_path, subdir}.
#                         If absent, the scope uses meta.output. Final doc path =
#                         <repo_path>/<subdir>/oncall-handover-<weekstart>.md ({year}
#                         expands to the weekstart's year). For a multi-scope combined
#                         run, the FIRST in-scope block that defines `output:` wins
#                         (the default ind,ksa run has none → meta.output).

meta:
  default_scope: [ind, ksa]          # used when --scope is omitted
  cubeapm_region: in                 # APM cube param for ALL regions (verified: KSA/MEA metrics live in apm-default; region only matters for LOGS)
  # DEFAULT output location — used by any scope WITHOUT its own `output:` override (i.e. ind, ksa).
  # Final path = <repo_path>/<subdir>/oncall-handover-<weekstart>.md  ({year} expands to the weekstart's year).
  output:
    repo_path: ~/Desktop/e-invoicing-be          # IND/KSA code repo clone (unchanged from the original skill)
    subdir: "oncall-handover/{year}"             # → ~/Desktop/e-invoicing-be/oncall-handover/2026/oncall-handover-<weekstart>.md
  sev1_channel:                      # shared cross-team Sev1 PD bot — common to ALL scopes
    name: "#sev1-engg"
    id: C08F1GJ9Z24

