    label: Malaysia (MY)
    # Auto-discovered 2026-06-15 — HIGH confidence (verified against ~90d PD incidents + live 7d CubeAPM traffic).
    output: { repo_path: ~/Desktop/einvoicing-core, subdir: "docs/oncall-handover/my" }   # → ~/Desktop/einvoicing-core/docs/oncall-handover/my/oncall-handover-<weekstart>.md
