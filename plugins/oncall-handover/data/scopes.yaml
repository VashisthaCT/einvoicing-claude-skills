    #   • ZERO matches for that regex, and zero e-invoicing MEA workloads of any spelling. The only `oci-mea` things
    #     paging via PV4Q1O5 are OTHER teams' services — kramer-v2, licensing-service, salessyncservice — plus infra.
    #     The `-prod-om-` hits there are Oman infra (kramer, userservice, enterprise-orchestrator), not e-invoicing.
    #   • MEA e-invoicing pages through its OWN service PIR440C instead, which pd_service_prefixes now matches.
    # So the DevOps-Alerts carve-out is unnecessary for MEA. Leave it off and leave the regex unfixed; if you ever
    # revive it, note the real workload names don't fit the old pattern anyway (Grafana rules like
    # `einvoicing-core-http-mea-low-apdex` have no `-prod-oci-` segment, and the Peppol pods carry a `-demo` infix:
    # `clear-peppol-ap-outbound-demo-prod-oci-mea-consumer`).
    l3_channels:
      - { name: "#einvoice-mea-l3-support", id: C0AB8EAH9A6 }   # HIGH confidence, live (Tabby UAE prod issues); Jira project MEA (board 1588). Does NOT use #einvoice-l3-support.
    l3_workflow_bot: {}   # no dedicated MEA escalation workflow found as of 2026-06-15 → Step 4 falls back to reply_count>=5. Re-check after MEA GA; add the bot here once it exists.
