      # Until this was added, ~1.3M calls/7d of live Oman production traffic were invisible to the MEA handover.
      - einvoicing-core-prod-om-http
      - einvoicing-integrations-prod-om-http
      - einvoicing-routing-prod-om-http
      - clear-peppol-ap-inbound-prod-om-http
      - clear-peppol-ap-outbound-prod-om-http
    generate_endpoints:
      - { service: einvoicing-core-prod-om-http, span_name: "v1/einvoice/generate (POST)" }             # ~278/7d — Oman generate (verified 2026-09-21)
      - { service: einvoicing-integrations-prod-om-http, span_name: "einvoice/v1/documents/send (POST)" } # ~11/7d — Oman Peppol dispatch; low but live
      - { service: einvoicing-core-prod-oci-mea-http, span_name: "v1/einvoice/generate (POST)" }        # ~3,487/7d (verified 2026-09-21; was ~298 in June — 11x growth)
      - { service: einvoicing-integrations-prod-oci-mea-http, span_name: "einvoice/v1/documents/send (POST)" } # ~306/7d — Peppol document dispatch/send (4/5-corner submit to AP)
      - { service: einvoicing-core-prod-oci-mea-http, span_name: "bulk/{mode}/** (POST)" }               # ~137/7d — bulk submit
      - { service: einvoicing-core-prod-oci-mea-http, span_name: "v1/participant/generate (POST)" }      # ~2/7d — Peppol participant registry (PINT-AE/OM), low but live
      - { service: einvoicing-core-prod-oci-mea-http, span_name: "v1/taxpayer/submit (POST)" }           # ~1/7d — taxpayer onboarding submit, low but live
