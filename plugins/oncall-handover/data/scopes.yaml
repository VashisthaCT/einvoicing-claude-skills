    alert_channels:
      - { name: "#einvoicing-global-pds-sev2", id: C0A6G866FH7 }   # misleadingly "global"-named but in practice carries ONLY [E-Invoicing-EU] PD-bot posts today; the pd_service_prefixes filter is what scopes it
