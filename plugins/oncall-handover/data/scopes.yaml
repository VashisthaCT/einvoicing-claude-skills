    l3_workflow_bot: { name: "EInvoicing Malaysia Customer Issues to L3", id: B07HAA03K0U }   # MY escalation workflow (Jira TMALOCJ/IMALOCJ); discovered 2026-06-15, verify on first run
    jira_projects: [TMALOCJ, IMALOCJ]
    oncall_handle: { id: S07H136RP0E }   # recorded as the MY on-call user group in the June discovery; not yet test-searched — verify on first run
    cubeapm_services:
      - einvoicing-core-prod-my-http
      - einvoicing-integrations-prod-my-http
      - einvoicing-routing-prod-my-http
    generate_endpoints:
      - { service: einvoicing-integrations-prod-my-http, span_name: "my/einvoice/v1/documents/generate (POST)" } # ~316k/7d — PRIMARY integration-side generate (highest volume)
      - { service: einvoicing-core-prod-my-http, span_name: "v1/einvoice/generate (POST)" }                      # ~303k/7d — PRIMARY single-invoice generate
      - { service: einvoicing-core-prod-my-http, span_name: "v1/einvoice/b2c/generate (POST)" }                  # ~1k/7d — B2C/self-billed consolidated path
      - { service: einvoicing-core-prod-my-http, span_name: "my/v1/einvoice/consolidate_generate (POST)" }       # ~16/7d — MY consolidated generate (low volume but live)
    topk_service_regex: "einvoicing-core-prod-my-http|einvoicing-integrations-prod-my-http|einvoicing-routing-prod-my-http"
    noisy_rule_ids: []   # MY anomaly alerts ("Einvoicing Core My Anomaly", "Routing MY Anomaly") exist but their CubeAPM rule_ids weren't captured — fill in after the first live run
    customers: [Samling]   # non-exhaustive; product field = "Einvoice Malaysia". Add tokens as you see them.
