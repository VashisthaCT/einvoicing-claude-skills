    cubeapm_services:
      - einvoicing-core-prod-eu-http
      - clear-peppol-ap-outbound-prod-eu-http
      - clear-peppol-ap-inbound-prod-eu-http
    generate_endpoints:
      - { service: einvoicing-core-prod-eu-http, span_name: "v1/einvoice/generate (POST)" }            # 6,172/7d verified 2026-09-21 (was ~15k in June — roughly halved; endpoint healthy, volume genuinely down)
      - { service: clear-peppol-ap-outbound-prod-eu-http, span_name: "clear-ap/v1/transactions (POST)" } # 466/7d verified 2026-09-21 (was ~825) — AS4 outbound transmit to Peppol network
    topk_service_regex: "einvoicing-core-prod-eu-http|clear-peppol-ap-outbound-prod-eu-http|clear-peppol-ap-inbound-prod-eu-http"
